[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetest"
version = "0.1.0"
description = "Authorization-gated security scanner for vibe-coded web applications (university final-year project)"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3.1",
  "sqlmodel>=0.0.22",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Week 4: SPA rendering (heavy — installs Chromium). Only Builder A needs this.
crawl = ["playwright>=1.44"]
# Week 9: PDF export (heavy on Windows). Optional.
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "pytest-snapshot>=0.9"]

[project.scripts]
vibetest = "vibetest.cli:app"

[tool.setuptools.packages.find]
include = ["vibetest*"]
